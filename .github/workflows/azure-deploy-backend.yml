# Deploys backend/ to an Azure App Service Web App on every push to main
# that touches the backend. Adapted from GitHub's official Python-to-Azure-
# App-Service template for this repo's monorepo layout (the app lives in
# backend/, not the repo root).
#
# One-time setup required before this workflow can succeed:
#   1. Create the Azure App Service (Linux, Python runtime) — e.g.:
#        az appservice plan create --resource-group MY_RG --name MY_PLAN --is-linux --sku B2
#        az webapp create --resource-group MY_RG --plan MY_PLAN --name MY_WEBAPP_NAME --runtime "PYTHON:3.13"
#   2. Set AZURE_WEBAPP_NAME below to that Web App's name.
#   3. Azure Portal -> your Web App -> Get publish profile -> download the
#      XML file, then add its full contents as a GitHub Actions secret named
#      AZURE_WEBAPP_PUBLISH_PROFILE (repo Settings -> Secrets and variables
#      -> Actions -> New repository secret).
#   4. Azure Portal -> your Web App -> Configuration -> General settings ->
#      Startup Command:
#        uvicorn app.main:app --host 0.0.0.0 --port 8000
#   5. Azure Portal -> your Web App -> Configuration -> Application settings
#      -> add every variable backend/app/config.py reads: SUPABASE_URL,
#      SUPABASE_SERVICE_ROLE_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY,
#      NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD, NEO4J_DATABASE,
#      SUPABASE_JWT_SECRET, FRONTEND_URL (copy values from the current
#      Vercel backend project) — plus SCM_DO_BUILD_DURING_DEPLOYMENT=1 so
#      Azure's Oryx builder installs requirements.txt server-side.
#   6. Once live, update the frontend's NEXT_PUBLIC_API_URL (Vercel project
#      settings) to this Web App's URL.

name: Deploy backend to Azure Web App

env:
  AZURE_WEBAPP_NAME: MY_WEBAPP_NAME   # <- replace with the real Web App name
  PYTHON_VERSION: '3.13'

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/azure-deploy-backend.yml'
  workflow_dispatch: {}   # allows a manual re-deploy from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up dependency caching for faster installs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (fail fast if requirements.txt is broken)
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Upload backend/ as the deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: backend
          # Oryx re-installs dependencies server-side (SCM_DO_BUILD_DURING_DEPLOYMENT=1)
          # from requirements.txt at the deployed root, so a local venv isn't needed here.

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v5
        with:
          name: backend-app
          path: .

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@85270a1854658d167ab239bce43949edb336fa7c
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
