# Deploys backend/ to the Azure App Service Web App "NJDOT" on every push to
# main that touches the backend. Adapted from GitHub's official Python-to-
# Azure-App-Service template for this repo's monorepo layout (the app lives
# in backend/, not the repo root).
#
# Uses a publish profile, not OIDC: OIDC needs an Azure AD App Registration /
# Managed Identity, which a school/EDU Azure tenant commonly blocks regular
# users from creating or viewing — confirmed blocked on this account. NJDOT
# has `adminEnabled: true` (basic publishing credentials on), so a publish
# profile downloads and works with no Azure AD permissions needed.
#
# One-time setup required before this workflow can succeed:
#   1. Azure Portal -> NJDOT -> Overview -> "Download publish profile" (or:
#        az webapp deployment list-publishing-profiles --resource-group NJ-Dot-Backend --name NJDOT --xml
#      ). Add the full XML contents as a GitHub Actions secret named
#      AZURE_WEBAPP_PUBLISH_PROFILE (repo Settings -> Secrets and variables
#      -> Actions -> New repository secret).
#   2. Azure Portal -> NJDOT -> Environment variables -> General settings ->
#      Startup Command:
#        uvicorn app.main:app --host 0.0.0.0 --port 8000
#   3. Azure Portal -> NJDOT -> Environment variables -> App settings -> add
#      every variable backend/app/config.py reads: SUPABASE_URL,
#      SUPABASE_SERVICE_ROLE_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY,
#      NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD, NEO4J_DATABASE,
#      SUPABASE_JWT_SECRET, FRONTEND_URL (copy values from the current
#      Vercel backend project), plus SCM_DO_BUILD_DURING_DEPLOYMENT=1 so
#      Azure's Oryx builder installs requirements.txt server-side.
#   4. Consider setting alwaysOn to true (same page, General settings) — it's
#      currently false, so the app can idle out and cold-start on the next
#      request; Basic tier supports Always On at no extra cost.
#   5. Once live, update the frontend's NEXT_PUBLIC_API_URL (Vercel project
#      settings) to https://njdot-f2f6a4baaedyhbfx.eastus-01.azurewebsites.net

name: Deploy backend to Azure Web App

env:
  AZURE_WEBAPP_NAME: NJDOT
  PYTHON_VERSION: '3.13'

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/azure-deploy-backend.yml'
  workflow_dispatch: {}   # allows a manual re-deploy from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up dependency caching for faster installs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (fail fast if requirements.txt is broken)
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Upload backend/ as the deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          # A bare directory path (e.g. "backend") preserves it as a prefix
          # inside the artifact -- the deployed content would then have
          # requirements.txt at backend/requirements.txt instead of the
          # root, and Oryx's "No framework detected" build step never finds
          # it. "backend/*" flattens everything after the wildcard instead,
          # so requirements.txt lands at the artifact's root as intended.
          path: backend/*
          # Oryx re-installs dependencies server-side (SCM_DO_BUILD_DURING_DEPLOYMENT=1)
          # from requirements.txt at the deployed root, so a local venv isn't needed here.

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v5
        with:
          name: backend-app
          path: .

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
