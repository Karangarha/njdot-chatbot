# Render Blueprint for the NJDOT Chatbot backend — moved off Vercel because
# a real compliance review exceeds both Vercel's fixed 4.5MB serverless
# request-body limit and its Hobby-tier 10s execution timeout. Render runs
# this as a persistent web service (plain uvicorn, no serverless wrapper),
# so neither limit applies here.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo. Render
# reads this file and creates the service below; you'll be prompted to fill
# in every "sync: false" value (copy them from the Vercel backend project's
# environment variables — this file intentionally never contains their
# values). See backend/app/config.py for what each one does.
services:
  - type: web
    name: njdot-chatbot-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://cm-chatbot-coral.vercel.app
      - key: ENVIRONMENT
        value: production
      # Optional — see config.py for defaults if omitted.
      - key: LLM_PROVIDER
        value: openai
      - key: GEO_REGION_VALIDATION
        value: hardcoded
      - key: REVIEW_CHECK_CONCURRENCY
        value: "8"
